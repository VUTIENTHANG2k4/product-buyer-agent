# Golden ghép mẫu (docs/04 §7): cặp offer (a, b) nên ghép (merge) hoặc nên giữ riêng (separate).
# Tiêu đề lấy từ fixture thật của GearVN, An Phát, FPT Shop. Fixture chưa có cặp laptop trùng giữa
# hai trang, nên các cặp laptop chéo trang dùng bản viết lại theo định dạng của trang kia
# (`synthetic_from` trỏ tới tiêu đề thật làm gốc). Ưu tiên "không ghép sai": thiếu cặp nên ghép
# chỉ làm tách hai dòng, ghép nhầm thì hiện sai giá.

