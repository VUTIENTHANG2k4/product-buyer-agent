# `docker compose up --build` chạy cả hệ thống demo (docs/10 §4): db, api, worker, mock-shop, web.
# Dev/test hằng ngày chỉ cần `make db-up` (service `db`). Docker Compose tự đọc `.env` ở thư mục gốc.
# Mọi cổng chỉ mở cho máy cục bộ (127.0.0.1).

x-backend: &backend
  build: ./backend
  image: product-buyer-backend:local  # một image cho api, worker, mock-shop
  # Cấu hình ứng dụng (UA, offline, SMTP, LLM...) lấy từ .env; chỉ các khóa dưới `environment` bị ghi đè
  # cho khớp với mạng của Compose. Không đóng .env vào image (xem backend/.dockerignore).
  env_file: .env
  environment: &backend-env
    # Trong mạng Compose, DB ở host `db` cổng 5432. Mật khẩu có ký tự đặc biệt phải mã hóa URL.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buyer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-product_buyer}
    MOCK_SHOP_URL: http://mock-shop:8100
  volumes:
    # Volume có tên (không phải bind mount) để user không root của container ghi được trên mọi hệ điều hành.
    - appdata:/app/data

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env (sao chép từ .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-product_buyer}
    ports:
      # Chỉ mở cho máy cục bộ. Đổi POSTGRES_PORT nếu cổng 5432 đã bị chiếm.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy khi volume rỗng: tạo database product_buyer_test cho pytest.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: server tạm lúc khởi tạo (chạy initdb.d) chỉ nghe unix socket, không báo healthy sớm.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    restart: unless-stopped
    # Migrate rồi mới nhận request; seed dữ liệu demo là bước riêng (docs/10 §3).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    # Thoát mã 0 khi SCHEDULER_ENABLED=false (mặc định): không tự khởi động lại. Cấu hình sai (cron) thoát
    # mã khác 0: thử lại tối đa 5 lần rồi dừng thay vì lặp vô hạn.
    restart: on-failure:5
    # Job đang gửi thông báo kịp xong (và commit) trước khi bị kill, tránh gửi trùng sau khi khởi động
    # lại; mặc định 10 giây ngắn hơn `CANCEL_WAIT_SECONDS` (30) của worker.
    stop_grace_period: 60s
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy # api đã migrate xong schema
      mock-shop:
        condition: service_started

  mock-shop:
    <<: *backend
    restart: unless-stopped
    command: ["uvicorn", "app.mock_shop.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      <<: *backend-env
      # Demo: captcha giả từ trang nội dung thứ 3, nên một lượt Laptop (3 trang) luôn gặp captcha.
      MOCK_SHOP_CAPTCHA_AFTER: "2"
    ports:
      - "127.0.0.1:8100:8100"

  web:
    build: ./frontend
    image: product-buyer-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  appdata:
