server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mọi lời gọi API (kể cả luồng SSE /api/chat/{id}/events) đi qua cùng origin.
    # Tắt buffering để sự kiện SSE tới trình duyệt ngay; HTTP/1.1 + Connection rỗng giữ kết nối mở.
    # Phân giải lại tên `api` qua DNS của Docker (không chốt IP lúc nginx khởi động), nên tạo lại
    # container api không làm web trả 502. Dùng biến trong proxy_pass để nginx gọi resolver.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Tệp băm tên từ Vite có thể cache lâu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: mọi đường dẫn khác trả index.html để React Router xử lý.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
