<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buyer Agent</title>
    <script>
      // Lựa chọn đã lưu (khóa trùng THEME_STORAGE_KEY ở src/lib/theme.ts), mặc định theo hệ điều hành.
      try {
        var stored = null
        try {
          stored = window.localStorage.getItem('buyer-agent-theme')
        } catch (e) {
          /* localStorage bị chặn: coi như chưa lưu */
        }
        if (
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* bỏ qua: dùng chế độ sáng */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
